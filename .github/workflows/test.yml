name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race -timeout 600s ./...

      - name: go build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null .

  # 跨平台编译矩阵.
  #
  # 平台特化文件在 Linux 上跑测试是覆盖不到的:
  #   proc_identity_windows.go 读 PEB 拿命令行
  #   proc_identity_linux.go   读 /proc/<pid>/cmdline
  #   proc_identity_unix.go    macOS/BSD 走 ps
  # 这类文件只在为对应平台编译时才会被检查, 漏了符号或写错 build tag
  # 在 CI 里看不出来. 之前 windows 分支就因为缺这一层, 带着
  # "undefined: processCommandLine" 一路到提交前才暴露.
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: "386"
          - goos: freebsd
            goarch: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null .
