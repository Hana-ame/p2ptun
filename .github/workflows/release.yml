name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run unit and integration tests
        run: go test -v -race ./...

      - name: Build static binaries (CGO off for old glibc / Termux)
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/p2ptun_linux_amd64 .
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/p2ptun_linux_arm64 .
          GOOS=linux   GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/p2ptun_linux_armv7 .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/p2ptun_windows_amd64.exe .

      - name: SHA256SUMS
        run: cd dist && sha256sum * > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 用 annotated tag 的消息作为 release notes.
          # 注意: actions/checkout 在 tag 事件下可能把远端 tag 落成本地 lightweight tag,
          # 此时 git for-each-ref '%(contents:body)' 会错误地取到 commit message;
          # --notes-from-tag 由 gh 直接读取远端 annotated tag, 不受本地 tag 形态影响.
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --notes-from-tag

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for f in p2ptun_* SHA256SUMS; do
            gh release upload "${{ github.ref_name }}" "$f" --repo "${{ github.repository }}" --clobber
          done